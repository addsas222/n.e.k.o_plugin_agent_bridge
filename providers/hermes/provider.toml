# Hermes 路由声明（Nous Research）。

schema = 1

[provider]
id = "hermes"
label = "Hermes（Nous Research）"
binary = "hermes"
mode = "flag"                       # `-z PROMPT`：一次性执行并退出
prompt_flag = "-z"
model_flag = "-m"
version_args = ["--version"]
aliases = ["hermes-agent"]

notes = "本机装在 ~/AppData/Local/hermes/，git 方式安装；只有 bin 目录，不要指望在 PATH 里。"

hints = [
    "`-z` 是一次性执行开关；`chat` 子命令是交互式，别用。",
    "需要本地 gateway 服务在跑。没跑时**退出码 0**，只打一行 `Error: Gateway inaccessible: service_manager_unavailable` —— 光看退出码会当成成功。",
    "沙箱/受限环境下启用 gateway 需要 schtasks.exe，可能被程序黑名单拦住。",
    "--skills <列表> 可以指定加载哪些 skill；--yolo 会跳过全部确认，桥接默认不加。",
]

# 不是鉴权问题，是运行时依赖缺失。单独一类，处置动作不同（去起服务，不是去登录）。
fail_patterns = [
    "gateway inaccessible",
    "service_manager_unavailable",
]
install_hint = "Hermes 走 git 安装：见 ~/AppData/Local/hermes；无包管理器命令"
