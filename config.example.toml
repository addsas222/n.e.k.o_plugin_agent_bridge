# 这是本插件运行配置的初始模板。
#
# N.E.K.O 第一次需要运行配置时，会把这份文件复制到
#   %LOCALAPPDATA%\N.E.K.O\plugins\agent_bridge\config\plugin.toml
# 之后**用户实际使用的是那一份**。以后再改这个模板，不会覆盖已经存在的用户配置。
#
# 所以：想调整行为请改用户数据目录里的 config/plugin.toml，不是这里。

[plugin_runtime]
enabled = true
auto_start = true

[bridge]
default_timeout_seconds = 600
max_timeout_seconds = 3600
max_output_bytes = 400000
default_cwd = ""
audit_log = ""
allow_parallel = true
max_parallel = 4

# 按需覆盖单个 Agent：
# [bridge.agents.dsh]
# enabled = true
# timeout_seconds = 900

# ---------------------------------------------------------------------------
# 安全审计（L1 派发前预检，默认关闭）
# ---------------------------------------------------------------------------
# 插件自带一份精简审计器（bridge/sentinel_core，MIT，纯标准库约 1.8k 行）：
# 派发前对任务文本做一次秒级规则预检，命中「一旦执行就回不来」的操作就拒绝派发。
# 内置后端在**同一进程内**判定，不需要起服务、不需要额外进程、不需要联网。
#
# 想对接上游完整版 Sentinel（GPL-3.0，含 GUI 与语义判定）时，把它单独跑起来，
# 再设 backend = "http" 和 url —— 只走公开 HTTP 契约，不 import 它任何源码。
#
# [bridge.sentinel]
# enabled = false
# backend = "builtin"          # builtin（进程内）| http（外部守护进程）
# url = ""                     # 仅 backend=http 时使用，只允许本机回环
# block_on_deny = true         # 命中后是否真的拒绝派发（false 则只记录）
# block_severity = "standard"  # standard（含可恢复高危）| red_line（只拦不可逆）
# attach = true                # 派发后是否把会话登记给审计层（best-effort）
# timeout = 2.0                # HTTP 后端的单次超时（秒）
#
# 以下能力默认全关 —— 开启才有额外开销（存储、模型调用、网络、进程干预）：
# store_path = ""              # 事件账本（SQLite）路径；留空放插件 data 目录
# retention_days = 30          # 账本保留天数，超期记录在启动时清理
# l2_enabled = false           # L2 语义判定（意图漂移）：要调模型、按 token 计费
# l2_min_interval = 20.0       # 两次 L2 判定的最小间隔（秒），防逐行触发烧穿
# l2_window = 10               # 每次判定只喂最近多少个动作
# l2_max_calls_per_hour = 120  # 每小时 L2 调用硬上限
# guard_action = "alert"       # alert（只告警）| terminate（终止进程树）
#                              # 终止不可逆，所以默认只告警，由人显式开启
#                              # 没有 suspend：挂起需要「恢复」那一半，而插件没有
#                              # 暂停等人确认的入口，缺了恢复就会冻到任务超时
# safepoint = false            # 派发前在 git 工作区打安全点（git stash create，不动工作区）
#                              # 每次约 0.9s（Windows 冷启更久），且会在目标仓库留一个
#                              # refs/sentinel/sp-*；对不可信仓库务必保持关闭
# webhook_url = ""             # 告警 webhook（仅 http/https）；留空只走本地通道
# timebox_seconds = 0          # 单个任务的时间盒上限（秒）；0 = 关闭
