# Harness 矩阵：每个 Agent 框架「skill 装到哪、插件（MCP）怎么注册」。
#
# 这张表是唯一需要手改的地方。skill 本体只有一份（skill/neko-bridge/），
# 各框架的差异是**安装位置**和**注册方式**，所以不生成 N 份重复的 SKILL.md。
#
# source = "local"  本机实测该目录/配置存在（2026-10-30）
# source = "docs"   取自各工具文档/社区约定，未在本机验证 —— 装之前先 `ls` 一下
#
# 跨工具事实（决定了下面为什么 .agents/skills 排第一）：
#   * `.agents/skills/` 是多个 harness 共用的公共位，Codex 会从 cwd 向上原生扫描；
#     Amp / Cursor / Copilot / Antigravity 也会读它。
#   * AGENTS.md 已成为跨工具事实标准（Linux Foundation / Agentic AI Foundation 治理）；
#     Claude Code 需要 CLAUDE.md 软链或 @import，其余多数直接读。
#   * 只有 Claude Code / Codex / Codex-style harness 把「插件」做成打包单位；
#     其余工具的「插件」实际就是 MCP server + skills 目录。
#
# kind:
#   cli     有可执行 CLI，可被 agent_bridge **派发**
#   ide     只有 IDE/扩展形态，不可派发；它的「插件」= MCP 注册 + skill 目录
#   generic 通用位置，多数 harness 都会读
#
# mcp_kind:
#   cli   用 mcp_command 注册（{name} / {bin} 占位替换）
#   file  往 mcp_target 的 mcpServers 里加（只打印片段，不自动改用户配置）
#   none  没有稳定 MCP 机制（用 skill 直接派发即可）

# ---------------------------------------------------------------- 通用位
[[harness]]
id = "agents"
label = "通用 .agents（跨工具公共位）"
kind = "generic"
skills_dir = "~/.agents/skills"
mcp_kind = "file"
mcp_target = "~/.agents/mcp-settings.json"
verified = true
source = "local"
note = "Codex 原生扫描；Amp/Cursor/Copilot/Antigravity 也读这里。优先装这一处"

