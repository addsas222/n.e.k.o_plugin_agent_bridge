# ---------------------------------------------------------------- 机器人框架
# 这类不是"编码 Agent"，而是**宿主**：它自己接消息平台，用插件扩展能力。
# 插件规范与 skill 无关，必须按它自己的格式写（见 plugins/astrbot/）。

[[harness]]
id = "astrbot"
label = "AstrBot（多平台聊天机器人框架）"
kind = "server"
form = "server"
skills_dir = ""
mcp_kind = "file"
mcp_target = "E:/data/mcp_server.json"
plugin = "native"
verified = true
source = "local"
install_hint = "本机数据根在 E:////data（ASTRBOT_ROOT=E:////），主程序不在该目录"
note = "实测：数据根 E:////data，内含 cmd_config.json / mcp_server.json / plugins/ / data_v4.db。MCP 段在 **mcp_server.json**（不是 cmd_config.json），形状是 mcpServers；插件装到 E:////data////plugins////<name>////（metadata.yaml 四字段必填，主类继承 star.Star 或叫 Main）"
