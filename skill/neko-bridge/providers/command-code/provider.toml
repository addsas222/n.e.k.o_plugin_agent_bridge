# Command Code 路由声明。

schema = 1

[provider]
id = "command-code"                 # 必须 == 目录名
label = "Command Code"
binary = "command-code"             # 另有 commandcode / cmdc 两个同名入口
mode = "switch"                     # `-p, --print [query]`：取值可选，正文按位置参数跟后面
prompt_flag = "-p"
model_flag = "--model"
json_args = ["--output-format", "json"]
version_args = ["--version"]
aliases = ["cmdc", "commandcode"]

notes = "官方横幅自称 `cmd`，但 `cmd` 在 Windows 上是 cmd.exe，故**不**登记为别名。"

hints = [
    "未登录时退出码 **3**，stderr 是 `Error: Authentication failed. Please run \"cmdc login\" first.` —— 必须靠 auth_patterns 认出来，否则只会被报成普通 FAILED。",
    "-p 的取值是可选的（[query]），所以登记为 mode=switch：先 `-p` 再把正文当位置参数。",
    "--max-turns 默认 100，命中上限会以 exit=8 结束，不是普通失败；长任务请显式放宽或拆小。",
    "--yolo / --permission-mode 会绕过权限确认，桥接默认不加。",
]

auth_patterns = [
    "authentication failed",
    "please run .{0,12}login.{0,4} first",
]

login_hint = "需要先登录：cmdc login（等价于 command-code login）"

install_cmd = "bun add -g command-code"   # 本机 bun 全局包名实测
