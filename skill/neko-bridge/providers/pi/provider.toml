# pi 路由声明。
#
# ⚠️ 这个名字曾经是 omp 的别名（`ALIASES["pi"] = "omp"`），那是**错的**，已移除：
#   - `omp`   来自 @oh-my-pi/pi-coding-agent        （本机 v18.12.6）
#   - `pi`    来自 @earendil-works/pi-coding-agent  （本机 v1.4.0）
#   两个不同产品共用了可执行名 `pi`。旧别名让「按 pi 找 omp」成立、真正的 pi 永远调不到。
#   现在 pi 独立登记，omp 用 omp / oh-my-pi / ompi。

schema = 1

[provider]
id = "pi"                           # 必须 == 目录名
label = "pi（AI coding assistant）"
binary = "pi"
mode = "switch"                     # `--print, -p` 是布尔开关，正文是位置参数 [messages...]
prompt_flag = "-p"
model_flag = "--model"
json_args = ["--mode", "json"]       # 注意是 --mode，不是 --output-format
version_args = ["--version"]
aliases = ["pi-coding-agent", "earendil-pi"]

notes = "只装 tools（read/bash/edit/write）的极简编码助手；扩展、技能、MCP 都要显式开启。"

hints = [
    "`-p` 不吃值（它是 boolean），正文必须走位置参数 —— 登记成 mode=flag 会拼出 `-p <task>` 之外的怪形态，用 switch 才对。",
    "扩展/技能默认会做发现扫描；批量派发时用 --no-extensions / --no-skills 可以显著降低启动抖动（走配置的 extra_args）。",
    "--mode json 输出的是事件流，取正文需要额外解析；默认别开。",
    "本机沙箱里 `pi -p` 曾被程序黑名单拦在 reg.exe 上（与 claude 同因），表现为「无输出 + 非 0 退出」。宿主环境若无此限制则正常。",
]

# ⚠️ 这一条是**推断值，未在真机上观测到**：本机沙箱把它拦在 reg.exe，
# 没拿到真实鉴权失败文本。依据是 `pi auth <command>  Print credentials or check
# provider readiness` 这个子命令。登录/换机后请实测一次并替换成原文措辞。
auth_patterns = ["pi auth"]

login_hint = "pi 需要先配置凭据：`pi auth` 查看 provider 就绪状态，或用 --api-key / 环境变量提供"

install_cmd = "bun add -g @earendil-works/pi-coding-agent"   # 本机 bun 全局包名实测
