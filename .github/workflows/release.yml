# Generated by neko-plugin
# managed-template: plugin-market-actions-v1
#
# ⚠️ 本地改动：在 release 之前插了一个 `tests` 门禁（needs）。
#    - 不用 `uses:` 复用 ci.yml，而是**内联**同一套步骤：
#      复用路径只有在 tag 触发时才会被验证，而 tag 就是发布 ——
#      发布流水线不该留未经执行的间接层。
#    - 用 neko-plugin 重新生成本文件会覆盖它：tests/test_workflows.py 盯着结构，
#      两处 pins 不一致或 `needs: tests` 消失，pytest 立刻失败。
name: Release N.E.K.O Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 门禁：功能测试不绿就不发布。
  tests:
    name: 发布前测试 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.1.1" "pytest-asyncio==1.4.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: python -m pytest tests -q

  release:
    needs: tests
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-release.yml@main
    with:
      plugin-id: agent_bridge
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: main
