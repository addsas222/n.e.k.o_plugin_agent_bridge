[project]
name = "agent_bridge"
version = "0.2.2"
description = "N.E.K.O local coding-agent bridge: dispatch tasks to local coding-agent CLIs as entries and LLM tools; built-in 9 agents plus data-driven providers/ for the rest"
requires-python = ">=3.11"
# 纯标准库 + 宿主自带 SDK；无第三方依赖。
dependencies = []

[tool.pytest.ini_options]

# 警告一律按错误处理。两个显式豁免（均为宿主/环境所有，非插件缺陷）：
# 1. plugin.settings 的 DeprecationWarning：宿主 SDK 导入链自带
# 2. PytestUnraisableExceptionWarning：Windows Proactor 事件循环 GC 时序，
#    宿主自带 lifekit 套件在本机同样触发
filterwarnings = [
    "error",
    "ignore:plugin.settings.PLUGIN_CONFIG_ROOT:DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

asyncio_mode = "auto"
testpaths = ["tests"]

# 用 importlib 模式按文件路径导入测试模块。
# 默认的 prepend 模式会把**仓库根目录**当成包导入，于是执行根 `__init__.py`
# 时去 import 宿主的 plugin.sdk —— 本地因为目录名恰好是 agent_bridge、
# 被 conftest 的命名空间桩挡住，所以一直没暴露；CI 的检出目录名是
# n.e.k.o_plugin_agent_bridge，直接就 ModuleNotFoundError 了。
addopts = "--import-mode=importlib"
