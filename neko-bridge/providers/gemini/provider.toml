# Gemini CLI 路由声明。
#
# 这个文件是「数据」，不是代码：新增 / 修改 Agent 只需改这里，不用动 bridge/。
# 字段含义见 providers/README.md，校验规则见 bridge/providers.py。

schema = 1

[provider]
id = "gemini"                       # 必须 == 目录名
label = "Gemini CLI（Google）"
binary = "gemini"                   # PATH 上查找的名字
mode = "flag"                       # -p/--prompt 自己吃值：`gemini -p "<task>"`
prompt_flag = "-p"
model_flag = "-m"
json_args = ["-o", "json"]          # `-o` 的取值只能 text/json/stream-json
version_args = ["--version"]
aliases = ["gcli", "geminicli"]

notes = "官方 Gemini CLI（@google/gemini-cli）。headless 模式用 -p/--prompt。"

hints = [
    "未配置鉴权时退出码 **41**（不是 1），只在 stderr 打一句「Please set an Auth method…」。不靠 auth_patterns 认出来，就会被报成普通 FAILED：不进 needs_login、不跳过、也不提示换一个 Agent。",
    "-o json 会把 stdout 变成 JSON 对象（正文在 response 字段），要看正文就别开 json_args；agent_run 默认不开。",
    "--yolo / --approval-mode yolo 会自动接受所有动作，桥接默认不加，需要时用配置的 extra_args 显式打开。",
]

# 这个 Agent 专属的鉴权失败特征（正则片段，大小写不敏感）。
# 实测原文：
#   Please set an Auth method in your C:\Users\<user>\.gemini\settings.json or specify
#   one of the following environment variables before running: GEMINI_API_KEY,
#   GOOGLE_GENAI_USE_VERTEXAI, GOOGLE_GENAI_USE_GCA
auth_patterns = [
    "please set an auth method",
    "specify one of the following environment variables",
]

login_hint = "gemini 需要先配鉴权：设 GEMINI_API_KEY 环境变量，或在 ~/.gemini/settings.json 里选一种 Auth 方式"

install_cmd = "bun add -g @google/gemini-cli"   # 本机 bun 全局包名实测
